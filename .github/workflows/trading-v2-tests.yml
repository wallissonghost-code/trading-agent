name: Trading Agent V2 tests

on:
  push:
    branches:
      - trading-agent-v2
    paths:
      - 'trading-v2/**'
      - '.github/workflows/trading-v2-tests.yml'
  pull_request:
    paths:
      - 'trading-v2/**'
      - '.github/workflows/trading-v2-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trading-v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated tests
        run: npm test
